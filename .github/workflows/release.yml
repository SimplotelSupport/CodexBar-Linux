name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli:
    name: build CLI (.deb + .tar.gz)
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version ^2

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release for ${VERSION}"

      - name: cargo build --release -p codexbar-core
        run: cargo build --release -p codexbar-core

      - name: Smoke test CLI release binary
        run: |
          ./target/release/codexbar --version
          ./target/release/codexbar --help | head -20
          ./target/release/codexbar usage --help | grep -q openrouter

      - name: cargo test --release -p codexbar-core
        run: cargo test --release -p codexbar-core

      - name: Build .deb
        run: cargo deb -p codexbar-core --no-build --output target/debian/

      - name: Build tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="codexbar-${VERSION}-linux-amd64"
          mkdir -p "dist/${STAGE}"
          cp target/release/codexbar "dist/${STAGE}/"
          cp README.md LICENSE NOTICE "dist/${STAGE}/"
          cp crates/codexbar-core/LICENSE-WIN-CODEXBAR "dist/${STAGE}/" || true
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          ls -la dist/

      - name: Generate SHA-256 sidecars
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for f in target/debian/*.deb dist/*.tar.gz; do
            cp "$f" artifacts/
          done
          cd artifacts
          for f in *.deb *.tar.gz; do
            sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codexbar-cli-linux-amd64
          path: artifacts/
          if-no-files-found: error

  build-desktop:
    name: build Desktop (Tauri .deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            file \
            wget

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version ^2

      - name: Build Tauri bundle (.deb + AppImage)
        working-directory: apps/desktop-tauri
        run: cargo tauri build --bundles deb appimage --verbose

      - name: Collect desktop artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Tauri 2 outputs to target/release/bundle/{deb,appimage}/
          for f in target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage; do
            if [ -f "$f" ]; then
              cp "$f" artifacts/
            fi
          done
          cd artifacts
          for f in *.deb *.AppImage; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codexbar-desktop-linux-amd64
          path: artifacts/
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: [build-cli, build-desktop]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          name: codexbar-cli-linux-amd64
          path: artifacts/

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          name: codexbar-desktop-linux-amd64
          path: artifacts/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          IS_PRE=""
          if [[ "${TAG}" == *"-alpha"* || "${TAG}" == *"-beta"* || "${TAG}" == *"-rc"* ]]; then
            IS_PRE="--prerelease"
          fi
          ls -la artifacts/
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            ${IS_PRE} \
            artifacts/*
