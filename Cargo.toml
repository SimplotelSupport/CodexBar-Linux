[workspace]
resolver = "2"
members = ["crates/codexbar-core", "apps/desktop-tauri"]

[workspace.package]
version = "0.2.0-alpha.3"
edition = "2024"
rust-version = "1.85"
authors = ["sidhartha1s"]
license = "MIT"
repository = "https://github.com/sidhartha1s/CodexBar-Linux"
description = "Linux/Ubuntu port of CodexBar: an AI provider usage/quota monitor"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
